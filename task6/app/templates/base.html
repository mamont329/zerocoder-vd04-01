<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой Сайт{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- ===== МЕНЮ: описано один раз, попадёт на все страницы ===== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Мой Сайт</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menu" aria-controls="menu"
                        aria-expanded="false" aria-label="Меню">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link {% if active == 'home' %}active{% endif %}" href="/home">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if active == 'anketa' %}active{% endif %}" href="/anketa">Анкета</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if active == 'quote' %}active{% endif %}" href="/quote">Цитаты</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if active == 'about' %}active{% endif %}" href="/about">О проекте</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== КОНТЕНТ: каждая страница заполнит этот блок своим ===== -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- ===== ФУТЕР: общий ===== -->
    <footer class="bg-dark text-light py-4">
        <div class="container text-center">
            <p class="mb-0">© 2026 Мой Сайт. Учебный проект на Flask.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
