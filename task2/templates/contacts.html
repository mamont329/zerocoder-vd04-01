<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Мой Сайт</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- ===== МЕНЮ (одинаковое на всех страницах) ===== -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Мой Сайт</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menu" aria-controls="menu"
                        aria-expanded="false" aria-label="Меню">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="/blog">Блог</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/contacts">Контакты</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== КОНТЕНТ ===== -->
    <main class="container my-5">

        <h1 class="mb-4">Контакты</h1>

        <div class="row g-4">
            <!-- Как нас найти -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Как нас найти</h5>
                        <p class="mb-1"><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 1</p>
                        <p class="mb-1"><strong>Телефон:</strong> +7 (900) 000-00-00</p>
                        <p class="mb-1"><strong>E-mail:</strong> info@mysite.ru</p>
                        <p class="mb-0"><strong>Часы работы:</strong> пн–пт, 9:00–18:00</p>
                    </div>
                </div>
            </div>

            <!-- Соцсети -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Мы в соцсетях</h5>
                        <ul class="list-unstyled mb-0">
                            <li class="mb-1"><a href="#">Telegram</a></li>
                            <li class="mb-1"><a href="#">VK</a></li>
                            <li class="mb-0"><a href="#">YouTube</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- ===== ФУТЕР ===== -->
    <footer class="bg-dark text-light py-4">
        <div class="container text-center">
            <p class="mb-0">© 2026 Мой Сайт. Учебный проект на Flask.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
